name: Deploy Sync-Worker (Cloudflare)

# Deployt cloudflare/worker.js als Worker, sobald auf main gepusht wird
# (oder manuell über Actions -> "Run workflow").
# Voraussetzung (einmalig, siehe README "Auto-Deploy des Workers"):
#   - Repo-Secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#   - KV-Namespace-ID in cloudflare/wrangler.toml eingetragen
#   - SYNC_TOKEN als Worker-Secret gesetzt (Dashboard oder `wrangler secret put`)
# Ist die Konfiguration unvollstaendig (Secrets fehlen oder Platzhalter-ID in
# wrangler.toml), wird der Deploy mit einem Warning uebersprungen statt rot zu laufen.

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare-Konfiguration pruefen
        id: guard
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if grep -q '<KV-NAMESPACE-ID>' cloudflare/wrangler.toml; then KV_ID_OK=false; else KV_ID_OK=true; fi
          echo "token=$HAS_TOKEN account=$HAS_ACCOUNT kv_id=$KV_ID_OK"
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ] && [ "$KV_ID_OK" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Hinweis bei unvollstaendiger Konfiguration
        if: steps.guard.outputs.configured != 'true'
        run: echo "::warning::Deploy uebersprungen - Repo-Secrets CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID und KV-Namespace-ID in cloudflare/wrangler.toml fehlen noch (siehe README 'Auto-Deploy des Workers')."
      - uses: cloudflare/wrangler-action@v3
        if: steps.guard.outputs.configured == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare/wrangler.toml
