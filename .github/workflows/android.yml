name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # nötig, damit bei einem Tag ein Release mit der APK angelegt werden darf
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: APK bauen
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk familienplaner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: familienplaner-apk
          path: app/familienplaner.apk

      # Release "latest": enthält immer die APK des neuesten Builds und ist direkt vom Handy ladbar
      # (Repo → Releases → "Aktuelle APK"). Ein Tag muss dafür nicht gepusht werden.
      - name: Release "latest" aktualisieren
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest familienplaner.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Aktuelle APK (Build ${{ github.run_number }})" \
            --notes "Familienplaner, Stand: ${GITHUB_SHA::7}. Datei familienplaner.apk herunterladen und installieren."

      # Bei einem Versions-Tag (v*) entsteht zusätzlich ein eigener Release.
      - name: Release für Versions-Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/familienplaner.apk

  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
